<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alex Silva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
            color: lime;
            font-family: monospace;
        }

        a {
            color: rgb(114, 244, 0);
        }

        img {
            width: 100%;
        }

        #content {
            width: 80%;
            max-width: 800px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .monitor {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
            height: fit-content;
        }

        .scanlines {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.1), rgba(0, 255, 0, 0.1) 2px, transparent 2px, transparent 4px);
            opacity: 0.4;
            height: 200vh;

        }



        .text {
            text-align: center;
            z-index: 1;
        }


        #home{
            font-size: xx-large;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .scanlines {
            z-index: 2;
        }

        .monitor {
            z-index: 1;
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="monitor">
        <div class="scanlines"></div>
        <a id="home" href="https://github.com/alex3aguiar/alex3aguiar/blob/main/README.md">home</a>
        <div id="content"></div>
        <a id="home" href="https://github.com/alex3aguiar/alex3aguiar/blob/main/README.md">home</a>
    </div>
    <script>
        window.onload = function () {
        
            function loadMD(file = 'README.md') {
                fetch(file)
                    .then(response => response.text())
                    .then(text => {
                        const converter = new showdown.Converter();
                        const html = converter.makeHtml(text);
                        document.getElementById('content').innerHTML = html;

                        Array.from(document.getElementsByTagName('a')).forEach(function (link) {
                            if (link.href && link.href.endsWith('.md')) {
                                link.addEventListener('click', function (event) {
                                    event.preventDefault();
                                    const urlNOva = link.href.split(`/main/`)[1]
                                    window.location.hash = urlNOva;
                                    loadMD(urlNOva)

                                });
                            }
                        });

                    })
                    .catch(error => console.error('Erro ao carregar o arquivo Markdown:', error));
            }
            if(window.location.hash){
                loadMD(window.location.hash.slice(1))
            }else{
                loadMD()
            }

            
        }
    </script>
    <script src="https://unpkg.com/showdown@2.1.0/dist/showdown.min.js"></script>
    <script>
        (function () {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&';
            const fontSize = 14;
            let columns, drops;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                columns = Math.floor(canvas.width / fontSize);
                drops = Array(columns).fill(1);
            }

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillStyle = drops[i] * fontSize < 30 ? '#aaffaa' : '#00ff41';
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            resize();
            window.addEventListener('resize', resize);
            setInterval(draw, 40);
        })();
    </script>
</body>

</html>
